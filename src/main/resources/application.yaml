
server:
  port: ${PORT:8085}
  url: ${SERVER_URL}

spring:
  forward-headers-strategy: framework
  datasource:
    url: ${POSTGRES_JDBC_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # devben oké, prodban inkább validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.pgy.no-ip.hu/realms/pgy
stripe:
  api:
    secretKey: ${STRIPE_API_SECRET_KEY}
    webhookSigningSecret: ${STRIPE_API_WEBHOOK_SIGNING_SECRET}
  prices:
    trial:
      id: ${STRIPE_PRICE_TRIAL_ID}
    premium-annual:
      id: ${STRIPE_PRICE_PREMIUM_ANNUAL_ID}
      subscription: true
    premium-monthly:
      id: ${STRIPE_PRICE_PREMIUM_MONTHLY_ID}
      subscription: true
    premium-lifetime:
      id: ${STRIPE_PRICE_PREMIUM_LIFETIME_ID}
logging:
  file:
    name: logs/application.log
    logback:
      rollingpolicy:
        file-name-pattern: "logs/application-%d{yyyy-MM-dd}.%i.log.zip"
        max-history: 30        # Hány napnyi zip fájlt tartson meg a rendszer
        max-file-size: 10MB    # Mikor darabolja a napi fájlt (tömörítés előtt)
        total-size-cap: 1GB    # Az archívumok maximális megengedett össztérfogata
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
